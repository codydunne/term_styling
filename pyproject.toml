[project]
name = "term-styling"
version = "0.3.2"
description = "Terminal output tiers for CLI scripts: plain ASCII when piped, color and OSC 8 links in a terminal, Nerd Font glyphs on request."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cody Dunne" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/codydunne/term_styling"

[dependency-groups]
# Exact pins: ty is pre-1.0 and its rules move between releases; uv.lock pins the rest.
dev = ["pytest>=8.3", "ruff==0.17.3", "ty==0.0.94"]

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
# Comments and docstrings run to 90; the formatter owns code width.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
