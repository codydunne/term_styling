name: Release

# A pushed vX.Y.Z tag publishes to PyPI; a manual run publishes to TestPyPI as a dry run.
# No tokens: both indexes trust this workflow file through PyPI trusted publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tag matches pyproject version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      # Includes the checks that CHANGELOG.md and README.md name this version.
      - run: uv run --locked pytest
      - run: uv build --clear
      - run: uv run --isolated --no-project --with dist/*.whl python -m term_styling
      - name: Publish to PyPI
        if: github.event_name == 'push'
        run: uv publish
      # --check-url skips files TestPyPI already has, so a rerun on the same version is a no-op.
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
      # The tag already exists (it triggered this run); --verify-tag refuses to create one.
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "term-styling ${GITHUB_REF_NAME#v}" --notes-file notes.md
